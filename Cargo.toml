[package]
name = "sayit"
version = "0.1.0"
edition = "2024"
description = "Private, local-only push-to-talk dictation for lower-end machines"
authors = ["ipsamurai <https://github.com/ipsamurai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ipsamurai/sayit"
readme = "README.md"
keywords = ["dictation", "speech-to-text", "offline", "privacy", "asr"]
categories = ["accessibility", "multimedia::audio"]
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
handy-keys = "0.3.4"
hound = "3.5.1"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
evdev = "0.13.2"
